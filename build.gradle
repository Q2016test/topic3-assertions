plugins {
    id 'java'
}

group = 'ru.homework'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Вторая задача: выполняется после test, в том числе при падении тестов.
def testRunFinished = tasks.register('testRunFinished') {
    group = 'verification'
    description = 'Prints a message after the test run.'
    doLast {
        println 'Test run is over'
    }
}

// Общие настройки для обычного прогона и демонстрации падающего ассерта.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // Случайные входные данные генерируются заново при каждом запуске.
    outputs.upToDateWhen { false }
    finalizedBy testRunFinished
}

// .\gradlew.bat test                  — все обычные тесты
// .\gradlew.bat test -Ptag=webinar    — только тесты вебинара
// .\gradlew.bat test -Ptag=lecture    — только тесты лекций
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'expected-failure'
        if (project.hasProperty('tag')) {
            includeTags project.property('tag').toString()
        }
    }
}

// .\gradlew.bat failingAssertions — намеренно падающий тест, 10 повторов.
// Задача должна завершиться ошибкой и показать expected / actual в отчёте.
tasks.register('failingAssertions', Test) {
    group = 'verification'
    description = 'Demonstrates an informative failing assertion (10 intentional failures).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'expected-failure'
    }
}
